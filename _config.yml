# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: DEV LOG - 프론트엔드 개발자의 기술 블로그
email: seungwoo321@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  프론트엔드 개발자의 개발 일기. JavaScript, Vue.js, React 등 프로젝트를 진행하며 겪은 시행착오와 기술 선택의 과정을 기록합니다. AI 에이전트, 트레이딩 봇 등 다양한 사이드 프로젝트 경험도 공유합니다.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://seungwoo321.github.io" # the base hostname & protocol for your site, e.g. http://example.com
repository: "Seungwoo321/seungwoo321.github.io"
locale: "ko_KR"
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: air

# Pagination (jekyll-paginate-v2)
pagination:
  enabled: true
  collection: posts
  per_page: 5
  permalink: /page/:num/
  title: ':title - Page :num'
  sort_reverse: true
  sort_field: 'date'
  trail:
    before: 2
    after: 2
author:
  name: "Seungwoo321"
  avatar: /assets/images/avata.png
  location: Seoul
  email: seungwoo321@gmail.com
  github: Seungwoo321

# Social profiles for Schema.org JSON-LD
social:
  type: Person
  name: "Seungwoo321"
  links:
    - "https://github.com/Seungwoo321"

og_image: /assets/images/og.png
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
keep_files:
  - .git
  - .svn
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
# Analytics
# google_analytics: true
analytics:
  provider               : "google-gtag"
  google:
    tracking_id          : G-DLLRFBXZCW

# Google AdSense
adsense:
  ad_client: "ca-pub-7701657858733816"
  data_ad_format: "auto"
  data_full_width_responsive: "true"

encoding: "utf-8"

# Sass settings - silence deprecation warnings from remote theme
sass:
  quiet_deps: true
  silence_deprecations:
    - slash-div
    - global-builtin
    - import

# Plugins (previously gems:)
plugins:
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-remote-theme

# Multiple Languages (manual implementation via lang/ref attributes)
languages: ["ko", "en", "ja"]
default_lang: "ko"

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme
search                   : true # true, false (default) 블로그 내 검색창 활성화
search_full_content      : # true, false (default)
search_provider          : lunr # lunr (default), algolia, google

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Defaults
defaults:
  # _posts
  - scope:
      path: ''
      type: posts
    values:
      layout: single
      author_profile: true
      toc: true
      toc_sticky: true
      read_time: true
      show_date: true
      comments: true
      related: true
      excerpt_separator: <!--more-->
      locale: ko
      sidebar:
        nav: "categories"
  # Exclude verification files from sitemap
  - scope:
      path: "google603171b62dec4aac.html"
    values:
      sitemap: false
  - scope:
      path: "naverd0af24031866c2cb391f545d6da12043.html"
    values:
      sitemap: false