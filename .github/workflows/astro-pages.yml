name: Deploy Astro to GitHub Pages
run-name: Deploy Astro ${{ inputs.revision || github.sha }}
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit to deploy (blank uses current main)
        required: false
        type: string
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      scheduled:
        default: false
        type: boolean
    outputs:
      upcoming_count:
        value: ${{ jobs.build.outputs.upcoming_count }}
      deployment_result:
        value: ${{ jobs.deploy.outputs.deployment_result }}
      finished:
        value: ${{ jobs.build.outputs.finished }}
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      actions: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      finished: ${{ steps.gate.outputs.finished }}
      upcoming_count: ${{ steps.plan.outputs.upcoming_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Identify the approved source
        run: echo "PUBLICATION_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check publication time and approved revision
        id: gate
        run: node scripts/publication.mjs gate
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED_RELEASE: ${{ inputs.scheduled && 'true' || 'false' }}
      - uses: actions/configure-pages@v6
        if: steps.gate.outputs.publish == 'true'
      - run: npm ci
        if: steps.gate.outputs.publish == 'true'
      - run: npm run build
        if: steps.gate.outputs.publish == 'true'
      - name: Read remaining publication times
        id: plan
        if: steps.gate.outputs.publish == 'true'
        run: node scripts/publication.mjs outputs
      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.publish == 'true'
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      deployment_result: ${{ steps.deployment.outcome }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
